
name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find and extract ZIP
        run: |
          mkdir extracted
          ZIP_FILE=$(find . -maxdepth 4 -type f -iname "*.zip" -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found!"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate Android project
        run: |
          PROJECT_FILE=$(find extracted -name settings.gradle.kts -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "Android project not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          cp -a "$PROJECT_DIR"/. .

      - name: Apply latest AssistantService
        run: |
          mkdir -p app/src/main/java/uz/jarvis/ai

          cp AssistantService.kt \
            app/src/main/java/uz/jarvis/ai/AssistantService.kt

          echo "Updated AssistantService.kt applied"
          echo "Checking source file:"
          grep -n "object : okhttp3.Callback" \
            app/src/main/java/uz/jarvis/ai/AssistantService.kt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
